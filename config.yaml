models:
  # --- Subject models (MindRouter) ---
  - name: gpt-oss-120b
    provider: openai_compat
    endpoint: "https://mindrouter.uidaho.edu/v1"
    model_id: "openai/gpt-oss-120b"
    api_key_env: MINDROUTER_API_KEY
    temperature: 0.0
    max_tokens: 4096
    timeout: 300.0
    modality: text

  - name: gpt-oss-20b
    provider: openai_compat
    endpoint: "https://mindrouter.uidaho.edu/v1"
    model_id: "openai/gpt-oss-20b"
    api_key_env: MINDROUTER_API_KEY
    temperature: 0.0
    max_tokens: 4096
    timeout: 300.0
    modality: text

  - name: qwen3.5-400b
    provider: openai_compat
    endpoint: "https://mindrouter.uidaho.edu/v1"
    model_id: "qwen/qwen3.5-400b"
    api_key_env: MINDROUTER_API_KEY
    temperature: 0.0
    max_tokens: 4096
    timeout: 300.0
    modality: vision

  - name: qwen3-vl-32b
    provider: openai_compat
    endpoint: "https://mindrouter.uidaho.edu/v1"
    model_id: "Qwen/Qwen3-VL-32B-Instruct"
    api_key_env: MINDROUTER_API_KEY
    temperature: 0.0
    max_tokens: 4096
    timeout: 300.0
    modality: vision

  # --- Generator model (for figurative descriptions) ---
  # Using a different MindRouter model than the subject to avoid confounds
  - name: qwen3.5-400b-gen
    provider: openai_compat
    endpoint: "https://mindrouter.uidaho.edu/v1"
    model_id: "qwen/qwen3.5-400b"
    api_key_env: MINDROUTER_API_KEY
    temperature: 0.7
    max_tokens: 4096
    timeout: 300.0
    modality: text

experiment:
  repeats: 1
  conditions:
    - examples_only
    - language_only
    - both

data:
  arc_dir: "data/arc"
  larc_dir: "data/larc"
